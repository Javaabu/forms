name: tests

on:
  push:
    branches:
      - main
      - next-gen
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    env:
      COVERAGE: ${{ matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, iconv, intl
          coverage: ${{ env.COVERAGE == 'true' && 'xdebug' || 'none' }}

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/phpunit ${{ env.COVERAGE == 'true' && '--coverage-clover=clover.xml' || '' }}

      - name: Upload coverage to Codecov
        if: env.COVERAGE == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: clover.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  pint:
    runs-on: ubuntu-latest

    name: Pint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: No javaabu/settings or javaabu/helpers in production dependencies
        run: |
          if composer show --tree --no-dev | grep -E 'javaabu/(settings|helpers)'; then
            echo "javaabu/forms must not require javaabu/settings or javaabu/helpers (see #18)"
            exit 1
          fi

      - name: Boost component reference is up to date
        run: |
          php scripts/components-reference.php
          git diff --exit-code -- resources/boost

  assets:
    runs-on: ubuntu-latest

    name: Assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Execute tests
        run: pnpm test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/clover.xml
          flags: js
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Onu classes match @javaabu/onu
        run: pnpm check

      - name: Built files are up to date
        run: |
          pnpm icons
          pnpm locales
          pnpm build
          git diff --exit-code -- resources/icons resources/js/locales dist
